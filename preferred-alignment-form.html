<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Address Submission</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fff;
    }

    #formDiv {
      height: 100%;
    }

    /* Mobile toast */
    #toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 9999;
      display: none;
      padding: 12px 14px;
      color: #fff;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    #toastTitle {
      margin-bottom: 4px;
      font-size: 14px;
      font-weight: 700;
    }

    #toastMsg {
      font-size: 13px;
      opacity: 0.95;
      overflow-wrap: anywhere;
    }
  </style>

  <!-- Survey123 Web Form JS API -->
  <script src="https://survey123.arcgis.com/api/jsapi/"></script>
</head>

<body>
  <div id="formDiv"></div>

  <div id="toast" role="status" aria-live="polite">
    <div id="toastTitle"></div>
    <div id="toastMsg"></div>
  </div>

  <script>
    const SURVEY_ITEM_ID = "d4f003f5be254f9bb5a8d92a281f9e13";
    const RESULT_PAGE =
      "https://webapp-host.github.io/ODOT2371/MapPage.html";

    // Alternative custom-domain address:
    // const RESULT_PAGE = "https://23-71study.com/MapPage.html";

    const toast = document.getElementById("toast");
    const toastTitle = document.getElementById("toastTitle");
    const toastMsg = document.getElementById("toastMsg");

    function showToast(title, message) {
      toastTitle.textContent = title || "";
      toastMsg.textContent = message || "";
      toast.style.display = "block";
    }

    const webform = new Survey123WebForm({
      container: document.getElementById("formDiv"),
      itemId: SURVEY_ITEM_ID
    });

    webform.setOnFormSubmit(() => {
      showToast(
        "Submitting…",
        "Please wait while we save your response."
      );
    });

    // Prevent double redirects if the submitted event fires twice.
    let redirected = false;

    webform.setOnFormSubmitted((data) => {
      console.log("onFormSubmitted:", data);

      if (redirected) {
        return;
      }

      const feature = data?.surveyFeatureSet?.features?.[0];
      const attributes = feature?.attributes || {};
      const addResult = data?.result?.[0]?.addResults?.[0] || {};

      const globalId =
        attributes.globalid ||
        attributes.GlobalID ||
        attributes.GLOBALID ||
        addResult.globalId ||
        addResult.globalID ||
        addResult.GlobalID;

      const objectId =
        attributes.objectid ||
        attributes.OBJECTID ||
        addResult.objectId ||
        addResult.objectID ||
        addResult.objectid;

      // Require a saved point location.
      const geometry = feature?.geometry || null;

      if (!geometry) {
        showToast(
          "Location missing",
          "It looks like a point location wasn’t saved. Please submit again and make sure you place or select the point."
        );
        return;
      }

      showToast("Submitted!", "Opening your map…");
      redirected = true;

      // Prefer the GlobalID.
      if (globalId) {
        window.location.assign(
          `${RESULT_PAGE}?gid=${encodeURIComponent(globalId)}`
        );
        return;
      }

      // Fall back to the ObjectID.
      if (Number.isFinite(Number(objectId))) {
        window.location.assign(
          `${RESULT_PAGE}?oid=${encodeURIComponent(objectId)}`
        );
        return;
      }

      redirected = false;

      showToast(
        "Submitted, but missing ID",
        "Please try again."
      );
    });
  </script>
</body>
</html>
